version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: optiland_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: optiland
      POSTGRES_PASSWORD: optiland123
      POSTGRES_DB: optiland_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
